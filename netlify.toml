[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# /api/* → Functions（前端主要走 /.netlify/functions/* 直接路径，这是双保险）
[[redirects]]
  from = "/api/cases"
  to = "/.netlify/functions/cases"
  status = 200

[[redirects]]
  from = "/api/case"
  to = "/.netlify/functions/case"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/chat/result"
  to = "/.netlify/functions/chat-result"
  status = 200

[[redirects]]
  from = "/api/accuse"
  to = "/.netlify/functions/accuse"
  status = 200

# 注意：不配置 SPA 回退（/* → /index.html）——
# 它会优先于 functions 路由，把 /.netlify/functions/* 也吞掉。
# 本游戏是单页无路由，无需回退。
